name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip install -r requirements-dev.txt ruff
      - run: choco install ffmpeg -y --no-progress
      - run: python scripts/create_demo.py
      - run: python -m pytest -q
      - run: python -m ruff check core ui srtstudio main.py --select E9,F63,F7,F82
  dependencies:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements-lock.txt --no-deps --disable-pip
